apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-trace-sim
  labels:
    app: vllm-trace-gate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-trace-gate
  template:
    metadata:
      labels:
        app: vllm-trace-gate
        llm-d.ai/engine-type: vllm
    spec:
      enableServiceLinks: false
      initContainers:
        - name: vllm-render
          image: docker.io/vllm/vllm-openai-cpu:v0.31.0
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command:
            - vllm
          args:
            - launch
            - render
            - __MODEL_NAME__
            - --port=8082
          ports:
            - name: http-render
              containerPort: 8082
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 2
            failureThreshold: 180
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            periodSeconds: 5
            failureThreshold: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "4"
              memory: 6Gi
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
      containers:
        - name: vllm-sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --model=__MODEL_NAME__
            - --port=8000
            - --render-url=http://localhost:8082
            - --max-model-len=4096
            - --max-num-seqs=64
            - --enable-kvcache=true
            - --kv-cache-size=4096
            - --block-size=16
            - --zmq-endpoint=tcp://__EPP_SERVICE_NAME__.__NAMESPACE__.svc.cluster.local:5557
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-trace-gate
  labels:
    app: vllm-trace-gate
spec:
  selector:
    app: vllm-trace-gate
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
