apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-trace-real
  labels:
    app: vllm-trace-gate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-trace-gate
  template:
    metadata:
      labels:
        app: vllm-trace-gate
        llm-d.ai/engine-type: vllm
    spec:
      enableServiceLinks: false
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.23.0
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model
            - __MODEL_NAME__
            - --enable-prefix-caching
            - --block-size
            - "16"
            - --max-model-len
            - "4096"
            - --enforce-eager
            - --gpu-memory-utilization
            - "0.5"
            - --port
            - "8000"
          env:
            - name: VLLM_USE_V1
              value: "1"
            - name: VLLM_SERVER_DEV_MODE
              value: "1"
            - name: PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 200
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 12Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-trace-gate
  labels:
    app: vllm-trace-gate
spec:
  selector:
    app: vllm-trace-gate
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
