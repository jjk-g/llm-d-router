# Standalone llm-d-router Helm values for Milestone 4 GKE Gates 3 & 4:
# - Service-mode Envoy proxy in front of 2 active-active EPP replicas
# - Exact vLLM HTTP tokenizer sidecar (vllm launch render Qwen/Qwen2.5-0.5B-Instruct)
# - GCS FUSE CSI volume mounted at /traces + pod-local emptyDir staging at /tmp/epp-traces
# - Kubernetes Secret epp-trace-hmac-secret mounted at /etc/epp-trace-secret

router:
  inferencePool:
    create: false

  modelServers:
    type: vllm
    protocol: http
    matchLabels:
      app: vllm-trace-gate
    targetPorts:
      - number: 8000

  proxy:
    enabled: true
    mode: service
    replicas: 1
    failOpen: false
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi

  extraServicePorts:
    - name: http
      port: 8081
      protocol: TCP
      targetPort: 8081
    - name: zmq
      port: 5557
      protocol: TCP
      targetPort: 5557

  monitoring:
    prometheus:
      enabled: false
      auth:
        enabled: false

  tokenizer:
    enabled: true
    flavor: python
    modelName: "Qwen/Qwen2.5-0.5B-Instruct"
    image:
      registry: docker.io
      repository: vllm/vllm-openai-cpu
      tag: v0.31.0
      pullPolicy: IfNotPresent
    port: 8000
    # Public HuggingFace model; clear default llm-d-hf-token Secret reference.
    env: []
    resources:
      requests:
        cpu: "1"
        memory: 3Gi
      limits:
        cpu: "4"
        memory: 6Gi

  epp:
    replicas: 2
    haMode: all-active
    terminationGracePeriodSeconds: 15
    image:
      registry: us-central1-docker.pkg.dev
      repository: my-gcp-project/llm-d/llm-d-router-endpoint-picker
      tag: v0.0.1-trace-gates
      pullPolicy: Always
    flags:
      v: 2
      allow-experimental-plugins: true
      drain-timeout: "5s"
    extraContainerPorts:
      - name: zmq
        containerPort: 5557
    podAnnotations:
      gke-gcsfuse/volumes: "true"
    podSecurityContext:
      fsGroup: 65532
    volumes:
      - name: gcs-traces
        csi:
          driver: gcsfuse.csi.storage.gke.io
          readOnly: false
          volumeAttributes:
            bucketName: my-llm-d-trace-bucket
            mountOptions: "implicit-dirs,uid=65532,gid=65532"
      - name: trace-staging
        emptyDir: {}
      - name: trace-hmac-secret
        secret:
          secretName: epp-trace-hmac-secret
    volumeMounts:
      - name: gcs-traces
        mountPath: /traces
      - name: trace-staging
        mountPath: /tmp/epp-traces
      - name: trace-hmac-secret
        mountPath: /etc/epp-trace-secret
        readOnly: true
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    pluginsConfigFile: trace-gate-plugins.yaml
    pluginsCustomConfig:
      trace-gate-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
          - type: openai-parser
          - type: agent-identity
          - type: token-producer
            parameters:
              modelName: "Qwen/Qwen2.5-0.5B-Instruct"
              vllm:
                url: "http://localhost:8000"
          - type: precise-prefix-cache-producer
            parameters:
              tokenProcessorConfig:
                blockSizeTokens: 16
              kvEventsConfig:
                zmqEndpoint: tcp://0.0.0.0:5557
              indexerConfig:
                kvBlockIndexConfig:
                  enableMetrics: false
          - type: prefix-cache-scorer
            parameters:
              prefixMatchInfoProducerName: precise-prefix-cache-producer
          - type: max-score-picker
          - type: single-profile-handler
          - name: trace-recorder
            type: kv-block-trace-recorder
            parameters:
              outputDir: "/traces/default-run/pass1"
              stagingDir: "/tmp/epp-traces"
              secretFilePath: "/etc/epp-trace-secret/capture_secret"
              blockSizeTokens: 16
              sampleRateBPS: 10000
              injectStreamIncludeUsage: true
              flushInterval: "3s"
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: max-score-picker
              - pluginRef: prefix-cache-scorer
                weight: 10
        requestHandler:
          parsers:
            - pluginRef: openai-parser
      no-recorder-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
          - type: openai-parser
          - type: agent-identity
          - type: token-producer
            parameters:
              modelName: "Qwen/Qwen2.5-0.5B-Instruct"
              vllm:
                url: "http://localhost:8000"
          - type: precise-prefix-cache-producer
            parameters:
              tokenProcessorConfig:
                blockSizeTokens: 16
              kvEventsConfig:
                zmqEndpoint: tcp://0.0.0.0:5557
              indexerConfig:
                kvBlockIndexConfig:
                  enableMetrics: false
          - type: prefix-cache-scorer
            parameters:
              prefixMatchInfoProducerName: precise-prefix-cache-producer
          - type: max-score-picker
          - type: single-profile-handler
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: max-score-picker
              - pluginRef: prefix-cache-scorer
                weight: 10
        requestHandler:
          parsers:
            - pluginRef: openai-parser
